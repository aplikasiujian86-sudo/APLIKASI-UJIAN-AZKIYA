let examDocMainTab='pondok',examDocLevel='MTs',examDocKind='nilai';
function renderExamDoc(kind){
 examDocKind=kind;
 const c=document.getElementById('content'),isNilai=kind==='nilai';
 c.innerHTML=`<div class="card"><div class="tabs"><button class="${examDocMainTab==='pondok'?'active':''}" onclick="examDocMainTab='pondok';renderExamDoc('${kind}')">${isNilai?'Blangko Pondok':'Berita Acara Pondok'}</button><button class="${examDocMainTab==='madrasah'?'active':''}" onclick="examDocMainTab='madrasah';renderExamDoc('${kind}')">${isNilai?'Blangko Madrasah':'Berita Acara Madrasah'}</button></div>
 ${examDocMainTab==='madrasah'?`<div class="tabs attendance-level-tabs"><button class="${examDocLevel==='MTs'?'active':''}" onclick="examDocLevel='MTs';renderExamDoc('${kind}')">MTs</button><button class="${examDocLevel==='MA'?'active':''}" onclick="examDocLevel='MA';renderExamDoc('${kind}')">MA</button></div>`:''}
 <div class="sectionhead"><h3>${examDocMainTab==='pondok'?(isNilai?'كشف درجات الطلاب':'محضر إجراء الامتحان'):(isNilai?'Blangko Nilai Ujian '+examDocLevel:'Berita Acara Ujian '+examDocLevel)}</h3><span class="muted">Pilih tanggal untuk memuat jadwal secara otomatis</span></div>
 <div class="formgrid" ${examDocMainTab==='pondok'?'dir="rtl"':''}>

 <div class="field"><label>${examDocMainTab==='pondok'?'المادة':'Mata Pelajaran'}</label><select id="examDocSubject" onchange="refreshExamDocOptions('subject')"><option value="">${examDocMainTab==='pondok'?'اختر المادة':'Pilih kelas terlebih dahulu'}</option></select></div>

function refreshExamDocOptions(changed=''){
 const kind=examDocMainTab,date=document.getElementById('examDocDate')?.value||'',level=examDocLevel;
 const cs=document.getElementById('examDocClass'),ss=document.getElementById('examDocSubject'),ts=document.getElementById('examDocTime');if(!cs||!ss||!ts)return;
 const oldC=changed==='class'?cs.value:'',oldS=changed==='subject'?ss.value:'';
 const day=attendanceSchedules(kind,date,level);
 let classes=[...new Set(day.flatMap(x=>attendanceClassNames(x,kind,level)))].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
 const wantedC=oldC||cs.value;
 cs.innerHTML=`<option value="">${classes.length?'Pilih kelas':'Tidak ada kelas pada tanggal ini'}</option>`+classes.map(v=>`<option value="${esc(v)}" ${v===wantedC?'selected':''}>${esc(v)}</option>`).join('');
 const selected=cs.value,filtered=day.filter(x=>!selected||attendanceClassNames(x,kind,level).includes(selected));
 const subjects=[...new Set(filtered.map(x=>x.mapel).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
 const wantedS=oldS||ss.value;
 ss.innerHTML=`<option value="">${subjects.length?'Pilih mata pelajaran':'Tidak ada mata pelajaran'}</option>`+subjects.map(v=>`<option value="${esc(v)}" ${v===wantedS?'selected':''}>${esc(v)}</option>`).join('');
 const selectedS=ss.value;let times=filtered.filter(x=>!selectedS||x.mapel===selectedS).map(x=>({value:[x.jamMulai||'',x.jamSelesai||''].join('|')+'|'+(x.sesi||''),label:[x.jamMulai&&x.jamSelesai?x.jamMulai+'–'+x.jamSelesai:'',x.sesi||''].filter(Boolean).join(' • ')||'Jam belum diatur'}));
 times=[...new Map(times.map(x=>[x.value,x])).values()];
 ts.innerHTML=`<option value="">${times.length?'Pilih jam':'Tidak ada jam tersedia'}</option>`+times.map(v=>`<option value="${esc(v.value)}">${esc(v.label)}</option>`).join('');
}
function generateExamDoc(){

 const schedules=attendanceSchedules(kind,date,level).filter(x=>x.mapel===subject&&attendanceClassNames(x,kind,level).includes(cls)&&String(x.jamMulai||'')===start&&String(x.jamSelesai||'')===end&&String(x.sesi||'')===session);
 if(!schedules.length){alert('Jadwal yang dipilih tidak ditemukan. Silakan pilih ulang.');return;}
 const field=attendanceStudentClassField(kind),students=(db.siswa||[]).filter(x=>String(x[field]||'')===cls&&(kind==='pondok'||!x.jenjang||String(x.jenjang)===level)).sort((a,b)=>String(a.nama||'').localeCompare(String(b.nama||''),'id'));
 const preview=document.getElementById('examDocPreview');if(!students.length){preview.innerHTML='<div class="notice">Belum ada siswa pada kelas yang dipilih. Periksa data kelas siswa terlebih dahulu.</div>';return;}
 const x=schedules[0],isNilai=examDocKind==='nilai';let html='';
 if(kind==='pondok'){
  const school=db.school||{},pondok=school.pondok||school.name||'المعهد الإسلامي';

  const body=isNilai?`<table class="arabic-table" dir="rtl"><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table>`:`<div class="ba-arabic" dir="rtl"><p>في هذا اليوم ${esc(date)}، أُجري امتحان مادة <b>${esc(subject)}</b> للفصل <b>${esc(cls)}</b> في الساعة <b>${esc([start,end].filter(Boolean).join(' – ')||session)}</b>.</p><p>في المدرسة / المعهد: ${esc(pondok)} &nbsp;&nbsp; القاعة: ${esc(x.ruang||'................')}</p><p>عدد الطلاب المقرر حضورهم: <b>${students.length}</b> طالبًا. عدد الطلاب الغائبين: .......... طالبًا. عدد الطلاب الحاضرين: .......... طالبًا.</p><p>وقد فُتح ظرف أسئلة امتحان مادة <b>${esc(subject)}</b>، ورمز الأسئلة: ............................</p><p>عدد أوراق الإجابة: .......... ورقة. وعدد كراسات الأسئلة: .......... كراسة. وعدد محاضر الامتحان: .......... نسخة.</p><p style="margin-top:18px">ملاحظات أثناء سير الامتحان:</p><p class="ba-lines">....................................................................................................................<br>....................................................................................................................<br>....................................................................................................................</p><p>حُرّر هذا المحضر بكل صدق.</p><div class="arabic-foot">محرّر المحضر<br><br>مراقب الامتحان<br><br><br><b>${esc(teacherDisplay(x.pengawas1)||'....................................')}</b><br>رقم الهوية: ....................................</div></div>`;
  html=`<style>@page{size:A4 portrait;margin:12mm}.arabic-doc{font-family:Arial,"Noto Naskh Arabic",serif}.arabic-kop{display:grid;grid-template-columns:22mm 1fr 22mm;align-items:center;text-align:center;border-bottom:3px double #111;padding-bottom:10px;margin-bottom:14px}.arabic-kop img{width:19mm;height:19mm;object-fit:contain}.arabic-kop h2{font-size:20px;margin:3px}.arabic-kop p{margin:3px;font-size:12px}.arabic-title{text-align:center;font-size:19px;margin:14px 0}.arabic-meta{display:flex;justify-content:space-between;direction:rtl;margin:12px 0;font-size:13px}.arabic-table{width:100%;border-collapse:collapse}.arabic-table th,.arabic-table td{border:1px solid #222;padding:7px;text-align:center;font-size:12px}.arabic-table th{background:#eee}.arabic-table td:nth-child(2){text-align:right}.arabic-foot{direction:rtl;text-align:right;margin-top:24px;margin-right:8%;width:45%}.ba-arabic{font-size:14px;line-height:2.05;text-align:justify}.ba-arabic p{margin:8px 0}.ba-arabic .ba-lines{line-height:2.6}.arabic-kop{border-bottom:3px double #111}</style><div class="arabic-doc"><div class="arabic-kop"><span>${school.logoKemenag?`<img src="${school.logoKemenag}">`:''}</span><div><p>وِزَارَةُ الشُّؤُونِ الدِّينِيَّةِ بِجُمْهُورِيَّةِ إِنْدُونِيسِيَا</p><h2>${esc(pondok)}</h2><p>لَجْنَةُ الِامْتِحَانَاتِ</p>${(school.addressPondok||school.address)?`<p dir="rtl">${esc(school.addressPondok||school.address)}</p>`:''}<p>العام الدراسي ${esc(school.year||'')}</p></div><span>${school.logoPondok?`<img src="${school.logoPondok}">`:''}</span></div><h3 class="arabic-title">${title}</h3><div class="arabic-meta"><span>التاريخ: ${esc(date)}</span><span>الصف: ${esc(cls)}</span><span>المادة: ${esc(subject)}</span><span>الوقت: ${esc([start,end].filter(Boolean).join(' - ')||session)}</span></div>${body}${isNilai?'<div class="arabic-foot">مدرس المادة<br><br><br>....................................</div>':''}</div>`;
 }else{
  const title=isNilai?'BLANGKO NILAI UJIAN':'BERITA ACARA PELAKSANAAN UJIAN';
  const kop=documentLetterhead('madrasah',level,title);
  if(isNilai){const rows=students.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.nama||'')}</td><td>${esc(v.nis||'-')}</td><td>${esc(v.nisn||'-')}</td><td>${esc(cls)}</td><td></td><td></td></tr>`).join('');html=`${kop}<p><b>Tanggal:</b> ${esc(date)} &nbsp; <b>Jenjang:</b> ${level} &nbsp; <b>Kelas:</b> ${esc(cls)}<br><b>Mata Pelajaran:</b> ${esc(subject)} &nbsp; <b>Jam:</b> ${esc([start,end].filter(Boolean).join('–')||session)}</p><table class="print-table"><thead><tr><th>No.</th><th>Nama Siswa</th><th>NIS</th><th>NISN</th><th>Kelas</th><th>Nilai</th><th>Keterangan</th></tr></thead><tbody>${rows}</tbody></table><div class="signature"><div>Guru Mata Pelajaran<div class="space"></div><b>(................................)</b></div><div>Mengetahui,<br>Kepala Madrasah<div class="space"></div><b>${esc(level==='MA'?(db.school?.headmasterMA||'-'):(db.school?.headmasterMTS||'-'))}</b></div></div>`;}
  else{html=`${kop}<div class="ba-id"><p>Pada hari ini, tanggal <b>${esc(date)}</b>, telah dilaksanakan Ujian ${esc(kind==='pondok'?'Pondok':'Madrasah')} mata pelajaran <b>${esc(subject)}</b> untuk kelas <b>${esc(cls)}</b> pada pukul <b>${esc([start,end].filter(Boolean).join('–')||session)}</b>.</p><p>Pada sekolah / pondok: <b>${esc(kind==='pondok'?(db.school?.pondok||'Pondok Pesantren'):(schoolIdentity('madrasah',level)))}</b><br>Ruang: <b>${esc(x.ruang||'........................')}</b></p><p>Jumlah peserta seharusnya: <b>${students.length}</b> orang.<br>Jumlah peserta yang tidak hadir: ............ orang.<br>Jumlah peserta yang hadir: ............ orang.</p><p>Pada ujian ini telah dibuka sampul soal mata pelajaran <b>${esc(subject)}</b> dengan kode: ............................</p><p>Jumlah lembar jawaban: ............ eksemplar. Jumlah naskah soal: ............ eksemplar. Jumlah berita acara: ............ eksemplar.</p><p><b>Catatan selama ujian berlangsung:</b></p><p class="ba-lines-id">........................................................................................................................................<br>........................................................................................................................................<br>........................................................................................................................................</p><p>Berita acara ini dibuat dengan sesungguhnya.</p><div class="ba-sign-id"><div>Yang membuat berita acara,<br><br><br><br><b>${esc(teacherDisplay(x.pengawas1)||'....................................')}</b><br>Pengawas Ujian<br>NIP: ....................................</div></div></div>`;}
 }
 preview.innerHTML=`<div class="notice">${isNilai?'Blangko nilai':'Berita acara'} siap dicetak. Kelas: ${esc(cls)}. Jumlah siswa: ${students.length}.</div><div class="toolbar no-print"><button onclick="printElement('examDocPrintArea')">Cetak / Simpan PDF</button></div><div id="examDocPrintArea" class="print-area">${html}</div>`;
}
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
const KEY='panitiaUjianMtsMa_v1';
const API_URL='https://script.google.com/macros/s/AKfycbzbx82L2wCeagk8-qmGZ3sY_VhKbXwgHHebAy0BerQrVdfHn6Zlznbd-Iph18mdVzBK/exec';
let syncTimer=null,syncBusy=false,syncPending=false,serverReady=false;
let authToken=sessionStorage.getItem('ujian_auth_token')||'',currentUser=null,allowedMenus=[];
const menus=[['dashboard','Dashboard'],['datamaster','Kelas & Mata Pelajaran'],['guru','Data Guru'],['siswa','Data Siswa'],['kartu','Kartu Ujian'],['pondok','Jadwal Ujian Pondok'],['madrasah','Jadwal Ujian Madrasah'],['absensiswa','Cetak Absen Siswa'],['nilai','Blangko Nilai Ujian'],['berita','Berita Acara Ujian'],['pengawas','Rekap Absen'],['stiker','Stiker Ujian']];
let db=load(),page='dashboard',mapelTab='pondok',editing=null,dashboardSub='';
const ALL_APP_MENUS=['dashboard','datamaster','guru','siswa','kartu','pondok','madrasah','absensiswa','nilai','berita','pengawas','stiker'];
function blank(){return {guru:[],siswa:[],kelas:[],jurusanMA:[],mapelPondok:[],mapelMadrasah:[],jadwalPondok:[],jadwalMadrasah:[],ujianLisanPondok:[],pengawasGrid:{},absensiSiswa:[],absensiPengawas:[],jamPelajaran:{pondok:{jam1:{mulai:'',selesai:''},jam2:{mulai:'',selesai:''},jam3:{mulai:'',selesai:''}},madrasah:{jam1:{mulai:'',selesai:''},jam2:{mulai:'',selesai:''},jam3:{mulai:'',selesai:''}}},school:{name:'MADRASAH TSANAWIYAH & ALIYAH',mts:'MADRASAH TSANAWIYAH',ma:'MADRASAH ALIYAH',pondok:'PONDOK PESANTREN',address:'',addressPondok:'',year:'2026/2027',headmaster:'',headmasterMA:'',headmasterMTS:'',logoMadrasah:'',logoMA:'',logoMTS:'',logoPondok:'',logoKemenag:''},cardDesign:{logoSize:16,logoShift:0,fontHead:6.5,fontBody:7.5,fontNumber:15,innerMargin:4.2,borderWidth:1.5,qrSize:8,qrShift:0}}}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');let x={...blank(),...(raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{})};['absensiSiswa','absensiPengawas'].forEach(k=>{x[k]=Array.isArray(x[k])?x[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v)):[]});['guru','siswa','kelas','mapelPondok','mapelMadrasah','jadwalPondok','jadwalMadrasah'].forEach(k=>{x[k]=Array.isArray(x[k])?x[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v)):[]});x.jurusanMA=Array.isArray(x.jurusanMA)?x.jurusanMA.filter(v=>v&&typeof v==='object'&&!Array.isArray(v)):[];x.ujianLisanPondok=Array.isArray(x.ujianLisanPondok)?x.ujianLisanPondok.filter(v=>v&&typeof v==='object'&&!Array.isArray(v)):[];if(!x.pengawasGrid||typeof x.pengawasGrid!=='object'||Array.isArray(x.pengawasGrid))x.pengawasGrid={};if(!x.school||typeof x.school!=='object'||Array.isArray(x.school))x.school=blank().school;x.cardDesign={...blank().cardDesign,...(x.cardDesign&&typeof x.cardDesign==='object'?x.cardDesign:{})};/* Migrasi aman: baris lama yang rusak dilewati, data valid tetap dipertahankan. */x.siswa.forEach(st=>{[['kelasMadrasah','Madrasah'],['kelasPondok','Pondok']].forEach(([f,j])=>{let n=String(st[f]||'').trim();if(n&&!x.kelas.some(k=>k.nama===n&&k.jenis===j&&k.jenjang===(st.jenjang||'MTs')))x.kelas.push({id:id(),jenjang:st.jenjang||'MTs',jenis:j,nama:n})})});return x}catch(e){console.error('Data lokal tidak dapat dibaca:',e);return blank()}}
let appLoadingCount=0,appLoadingTimer=null;
function showLoading(message='Memproses…'){appLoadingCount++;clearTimeout(appLoadingTimer);const el=document.getElementById('appLoading'),tx=document.getElementById('appLoadingText');if(tx)tx.textContent=message;if(el)el.classList.add('show')}
function hideLoading(){appLoadingCount=Math.max(0,appLoadingCount-1);if(appLoadingCount===0){appLoadingTimer=setTimeout(()=>{const el=document.getElementById('appLoading');if(el)el.classList.remove('show')},180)}}
let appToastTimer=null;
function showToast(message,type='success'){
 const el=document.getElementById('appToast');if(!el)return;
 el.textContent=message;el.classList.toggle('error',type==='error');el.classList.add('show');
 clearTimeout(appToastTimer);appToastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

function setSyncStatus(message,state='info'){let el=document.getElementById('syncStatus');if(el){el.textContent=message;el.dataset.state=state;}}
function activeCacheKey(){return currentUser&&currentUser.role!=='Admin'?'panitiaUjianMtsMa_user_'+currentUser.username:KEY}
function save(){if(currentUser&&currentUser.readOnly){alert('Akun Kepala Madrasah hanya dapat melihat data.');return}localStorage.setItem(activeCacheKey(),JSON.stringify(db));setSyncStatus('Perubahan tersimpan di perangkat • menyinkronkan ke Spreadsheet…','pending');clearTimeout(syncTimer);syncTimer=setTimeout(pushToServer,900)}
async function apiPost(payload){showLoading(payload.action==='save'?'Menyimpan data ke Spreadsheet…':'Memproses permintaan…');try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,token:authToken}),redirect:'follow'});const out=await res.json();if(!out.ok)throw new Error(out.error||out.message||'Permintaan gagal');return out}finally{hideLoading()}}
async function pushToServer(){if(!authToken||!currentUser||currentUser.readOnly)return false;if(syncBusy){syncPending=true;return false}syncBusy=true;syncPending=false;let success=false;try{await apiPost({action:'save',data:db});serverReady=true;success=true;setSyncStatus('Tersimpan di Google Spreadsheet ✓','ok')}catch(e){setSyncStatus('Gagal menyinkronkan: '+e.message,'error');console.error('Sinkronisasi gagal:',e)}finally{syncBusy=false;if(syncPending){syncPending=false;pushToServer()}}return success}
async function loadFromServer(){if(!authToken)return;showLoading('Memuat data aplikasi…');setSyncStatus('Menghubungkan ke Google Spreadsheet…','pending');try{const res=await fetch(API_URL+'?action=load&token='+encodeURIComponent(authToken)+'&t='+Date.now(),{method:'GET',cache:'no-store',redirect:'follow'});const out=await res.json();if(!out.ok)throw new Error(out.error||'Gagal membaca data');currentUser=out.user;allowedMenus=currentUser.role==='Admin'?ALL_APP_MENUS.slice():currentUser.menus||[];if(currentUser.role==='Kepala Madrasah')currentUser.readOnly=true;const localData=JSON.parse(localStorage.getItem(activeCacheKey())||'{}');db={...blank(),...localData,...(out.data||{})};db.cardDesign={...blank().cardDesign,...(localData.cardDesign||{}),...(out.data?.cardDesign||{})};localStorage.setItem(activeCacheKey(),JSON.stringify(db));serverReady=true;applyRoleUI();setSyncStatus('Login berhasil • data dimuat dari Spreadsheet ✓','ok');if(!allowedMenus.includes(page))page=allowedMenus[0]||'dashboard';nav();render()}catch(e){setSyncStatus('Gagal memuat data: '+e.message,'error');document.getElementById('loginError').textContent=e.message;document.getElementById('loginError').style.display='block';authToken='';sessionStorage.removeItem('ujian_auth_token');currentUser=null;document.getElementById('loginGate').style.display='flex'}finally{hideLoading()}}
async function loginApp(e){e.preventDefault();const err=document.getElementById('loginError');err.style.display='none';showLoading('Memeriksa akun…');try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username:document.getElementById('loginUsername').value,password:document.getElementById('loginPassword').value})});const out=await res.json();if(!out.ok)throw new Error(out.error||'Login gagal');authToken=out.token;sessionStorage.setItem('ujian_auth_token',authToken);currentUser=out.user;document.getElementById('loginGate').style.display='none';await loadFromServer()}catch(x){err.textContent=x.message;err.style.display='block'}finally{hideLoading()}}
async function logoutApp(){try{if(authToken)await apiPost({action:'logout'})}catch(e){}authToken='';currentUser=null;allowedMenus=[];sessionStorage.removeItem('ujian_auth_token');document.getElementById('loginGate').style.display='flex';document.getElementById('logoutBtn').style.display='none';document.getElementById('userInfo').textContent='';setSyncStatus('Silakan login untuk melanjutkan.','pending')}
function applyRoleUI(){document.getElementById('loginGate').style.display='none';document.getElementById('logoutBtn').style.display='inline-block';document.getElementById('userInfo').textContent=(currentUser.name||currentUser.username)+' • '+currentUser.role;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nav(){let visible=menus.filter(([k])=>allowedMenus.includes(k));if(currentUser?.role==='Admin')visible.push(['pengguna','Manajemen Pengguna']);document.getElementById('nav').innerHTML=visible.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${({dashboard:'▦',datamaster:'▤',guru:'♙',siswa:'♧',kartu:'▣',pondok:'◷',madrasah:'◷',absensiswa:'☷',nilai:'▤',berita:'▧',pengawas:'☑',stiker:'▣',pengguna:'♙'})[k]||'▦'} &nbsp; ${n}</button>`).join('')}
function go(p){if(p==='pengguna'&&currentUser?.role!=='Admin'){alert('Akses ditolak.');return}if(p!=='pengguna'&&!allowedMenus.includes(p)){alert('Anda tidak memiliki izin membuka menu ini.');return}page=p;editing=null;nav();document.getElementById('title').textContent=p==='pengguna'?'Manajemen Pengguna':(menus.find(x=>x[0]===p)||['','Dashboard'])[1];render();toggleMenu(false)}
function toggleMenu(force){let s=document.getElementById('sidebar'),o=document.getElementById('overlay');let open=force===undefined?!s.classList.contains('open'):force;s.classList.toggle('open',open);o.classList.toggle('show',open)}
function render(){if(!currentUser)return;if(page==='pengguna'){renderUsers();return}if(currentUser.readOnly)document.body.classList.add('readonly-user');else document.body.classList.remove('readonly-user');['guru','siswa','kelas','mapelPondok','mapelMadrasah','jadwalPondok','jadwalMadrasah'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[];else db[k]=db[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v))});if(!db.pengawasGrid||typeof db.pengawasGrid!=='object'||Array.isArray(db.pengawasGrid))db.pengawasGrid={};if(!db.school||typeof db.school!=='object')db.school=blank().school;if(page==='dashboard'&&dashboardSub){dashboardTool(dashboardSub);return}let c=document.getElementById('content');try{({dashboard:dashboard,datamaster:()=>masterDataPage(),guru:()=>crudPeople('guru'),siswa:()=>studentPage(),kartu:()=>printSelector('kartu'),stiker:()=>printSelector('stiker'),pondok:()=>schedule('pondok'),madrasah:()=>schedule('madrasah'),absensiswa:()=>adminPrint('absensiswa'),nilai:()=>adminPrint('nilai'),berita:()=>adminPrint('berita'),pengawas:()=>adminPrint('pengawas')})[page]();}catch(e){console.error('Gagal membuka menu '+page,e);if(c)c.innerHTML='<div class="card"><div class="notice">Menu gagal ditampilkan karena ada data lama yang formatnya belum sesuai. Data tidak dihapus. Muat ulang aplikasi, lalu coba kembali.</div><button onclick="render()">Coba Lagi</button></div>';}}

la Sekolah & Logo</h3><p class="muted">Nama kepala sekolah dan logo akan digunakan pada kartu ujian sesuai jenjang.</p><div class="formgrid"><div class="field"><label>Nama Kepala Sekolah MA</label><input id="headmasterMA" value="${esc(db.school.headmasterMA||'')}" placeholder="Nama kepala MA dan gelar"></div><div class="field"><label>Nama Kepala Sekolah MTs</label><input id="headmasterMTS" value="${esc(db.school.headmasterMTS||'')}" placeholder="Nama kepala MTs dan gelar"></div><div class="field"><label>Upload Logo Madrasah Aliyah (MA)</label><input type="file" accept="image/*" onchange="uploadSchoolLogo(event,'logoMA')"><div id="logoMAPreview">${db.school.logoMA?`<img src="${db.school.logoMA}" style="max-width:90px;max-height:70px;object-fit:contain">`:''}</div></div><div class="field"><label>Upload Logo Madrasah Tsanawiyah (MTs)</label><input type="file" accept="image/*" onchange="uploadSchoolLogo(event,'logoMTS')"><div id="logoMTSPreview">${db.school.logoMTS?`<img src="${db.school.logoMTS}" style="max-width:90px;max-height:70px;object-fit:contain">`:''}</div></div><div class="field"><label>Upload Logo Pondok</label><input type="file" accept="image/*" onchange="uploadSchoolLogo(event,'pondok')"><div id="pondokLogoPreview">${db.school.logoPondok?`<img src="${db.school.logoPondok}" style="max-width:90px;max-height:70px;object-fit:contain">`:''}</div></div><div class="field"><label>Upload Logo Kementerian Agama (Kemenag)</label><input type="file" accept="image/*" onchange="uploadSchoolLogo(event,'kemenag')"><div id="kemenagLogoPreview">${db.school.logoKemenag?`<img src="${db.school.logoKemenag}" style="max-width:90px;max-height:70px;object-fit:contain">`:''}</div></div></div><div class="toolbar"><button onclick="saveDashboardIdentity()">Simpan Identitas & Logo</button></div></div><div class="card"><h3>Ringkasan Jadwal Terdekat</h3>${table(db.jadwalPondok.concat(db.jadwalMadrasah).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).slice(0,6),['jenis','tanggal','sesi','mapel','pengawas1','pengawas2'],false)}</div>`}
function dashboardTool(tool){dashboardSub=tool;let c=document.getElementById('content');c.innerHTML=`<div class="toolbar"><button class="secondary" onclick="dashboard()">← Kembali ke Dashboard</button></div><div id="dashboardToolContent"></div>`;if(tool==='mapel')mapel();else kelasPage()}
let masterUnit='madrasah-mts',masterMATab='kelas',masterSection='kelas';

function masterDataPage(){
 let c=document.getElementById('content');
 const u=masterUnitParts(),arr=u.jenis==='Pondok'?db.mapelPondok:db.mapelMadrasah;
 const classes=db.kelas.filter(x=>x.jenis===u.jenis&&x.jenjang===u.jenjang).sort((a,b)=>a.nama.localeCompare(b.nama,'id',{numeric:true}));
 const subjects=arr.filter(x=>!x.jenjang||x.jenjang===u.jenjang).sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
 const unitTabs=[['madrasah-mts','MTs Madrasah'],['madrasah-ma','MA Madrasah'],['pondok-mts','MTs Pondok'],['pondok-ma','MA Pondok']];
 const isMA=u.jenis==='Madrasah'&&u.jenjang==='MA',majors=Array.isArray(db.jurusanMA)?db.jurusanMA:[];
 const sectionTabs=`<div class="tabs master-section-tabs"><button type="button" class="${masterSection==='kelas'?'active':''}" onclick="masterSection='kelas';masterMATab='kelas';masterDataPage()">Data Kelas</button><button type="button" class="${masterSection==='mapel'?'active':''}" onclick="masterSection='mapel';masterDataPage()">Data Mata Pelajaran</button></div>`;
 const unitNav=`<div class="tabs master-unit-tabs" style="flex-wrap:wrap">${unitTabs.map(([k,n])=>`<button type="button" class="${masterUnit===k?'active':''}" onclick="masterUnit='${k}';masterMATab='kelas';masterDataPage()">${n}</button>`).join('')}</div>`;
 let main='';
 if(masterSection==='kelas'){
  const majorTabs=isMA?`<div class="tabs"><button type="button" class="${masterMATab==='kelas'?'active':''}" onclick="masterMATab='kelas';masterDataPage()">Daftar & Tambah Kelas</button><button type="button" class="${masterMATab==='jurusan'?'active':''}" onclick="masterMATab='jurusan';masterDataPage()">Data Jurusan MA</button></div>`:'';
  if(!isMA||masterMATab==='kelas') main=`<div class="card"><h3>Tambah Kelas — ${u.jenjang} ${u.jenis}</h3><p class="muted">Isi nama tingkat sekali, lalu pilih rombel yang akan dibuat. Data kelas langsung tersedia pada pilihan Kelas di Data Siswa dan dokumen ujian.</p><form onsubmit="saveClassColumns(event)"><div class="formgrid"><div class="field"><label>Nama Tingkat *</label><input name="tingkat" required placeholder="Contoh: VII / X / XI / XII"></div>${isMA?`<div class="field"><label>Jurusan *</label><select name="jurusanId" required><option value="">Pilih jurusan</option>${majors.map(j=>`<option value="${esc(j.id)}">${esc(j.nama)}</option>`).join('')}</select>${!majors.length?'<small class="muted">Tambahkan jurusan terlebih dahulu pada tab Data Jurusan MA.</small>':''}</div>`:''}</div><div class="field" style="margin-top:12px"><label>Pilih Rombel (A–Z)</label><div class="rombel-check-grid" style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:9px 6px;max-width:620px">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(k=>`<label style="display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line,#ddd);border-radius:8px;padding:7px 3px;font-weight:600"><input type="checkbox" name="rombel" value="${k}" style="margin:0">${k}</label>`).join('')}</div></div><div class="toolbar"><button type="submit" ${isMA&&!majors.length?'disabled':''}>Simpan Kelas ${u.jenjang}</button></div></form><details style="margin-top:12px"><summary>Input nama kelas secara langsung</summary><form onsubmit="saveBulkMaster(event,'kelas')">${isMA?`<div class="field"><label>Jurusan *</label><select name="jurusanId" required><option value="">Pilih jurusan</option>${majors.map(j=>`<option value="${esc(j.id)}">${esc(j.nama)}</option>`).join('')}</select></div>`:''}<div class="field"><label>Daftar Nama Kelas (satu kelas per baris)</label><textarea name="items" rows="4" placeholder="VII A&#10;VII B&#10;VIII A"></textarea></div><div class="toolbar"><button type="submit">Simpan Daftar Kelas</button></div></form></details></div><div class="card"><div class="sectionhead"><h3>Daftar Kelas</h3><span class="muted">${classes.length} kelas terdaftar</span></div>${classes.length?`<div class="tablewrap"><table><thead><tr><th>Nama Kelas</th>${isMA?'<th>Jurusan</th>':''}<th>Aksi</th></tr></thead><tbody>${classes.map(x=>`<tr><td>${esc(x.nama)}</td>${isMA?`<td>${esc(majors.find(j=>j.id===x.jurusanId||(j.kelas||[]).includes(x.id))?.nama||'-')}</td>`:''}<td><button type="button" class="danger" onclick="deleteMasterItem('kelas','${esc(x.id)}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada kelas pada unit ini.</div>'}</div>`;
  else main=`<div class="card"><h3>Data Jurusan MA</h3><p class="muted">Daftarkan jurusan yang tersedia. Jurusan ini digunakan untuk mengelompokkan kelas dan mata pelajaran MA.</p><form onsubmit="saveMasterMajor(event)"><div class="formgrid"><div class="field"><label>Nama Jurusan *</label><input name="nama" required placeholder="Contoh: IPA, IPS, Bahasa"></div></div><div class="toolbar"><button type="submit">Simpan Jurusan</button></div></form><div class="sectionhead"><h3>Daftar Jurusan (${majors.length})</h3></div>${majors.length?`<div class="tablewrap"><table><thead><tr><th>Nama Jurusan</th><th>Jumlah Kelas</th><th>Aksi</th></tr></thead><tbody>${majors.map(j=>`<tr><td>${esc(j.nama)}</td><td>${classes.filter(k=>k.jurusanId===j.id||(j.kelas||[]).includes(k.id)).length}</td><td><button type="button" class="danger" onclick="deleteMasterMajor('${esc(j.id)}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada jurusan MA.</div>'}</div>`;
 }else{
  main=`<div class="card"><h3>Tambah Banyak Mata Pelajaran — ${u.jenjang} ${u.jenis}</h3><p class="muted">Masukkan satu mata pelajaran per baris. Daftar ini terpisah dari Data Kelas.</p><form onsubmit="saveBulkMaster(event,'mapel')">${isMA?`<div class="field"><label>Jurusan pemilik mata pelajaran *</label><select name="jurusanId" required><option value="">Pilih jurusan</option>${majors.map(j=>`<option value="${esc(j.id)}">${esc(j.nama)}</option>`).join('')}</select><small class="muted">Mata pelajaran yang dimasukkan hanya akan terkait dengan jurusan yang dipilih.</small></div>`:''}<div class="field"><label>Daftar Mata Pelajaran *</label><textarea name="items" rows="5" placeholder="Al-Qur’an Hadis&#10;Akidah Akhlak&#10;Fikih" required></textarea></div><div class="toolbar"><button type="submit" ${isMA&&!majors.length?'disabled':''}>Simpan Mata Pelajaran</button></div></form></div><div class="card"><div class="sectionhead"><h3>Daftar Mata Pelajaran</h3><span class="muted">${subjects.length} mata pelajaran terdaftar</span></div>${subjects.length?`<div class="tablewrap"><table><thead><tr><th>${isMA?'Jurusan':'Unit'}</th><th>Nama Mata Pelajaran</th><th>Aksi</th></tr></thead><tbody>${subjects.map(x=>`<tr><td>${isMA?esc(majors.find(j=>j.id===(x.jurusanId||x.majorId))?.nama||'Belum dipisahkan'):u.jenjang+' '+u.jenis}</td><td>${esc(x.nama)}</td><td><button type="button" class="danger" onclick="deleteMasterItem('mapel','${esc(x.id)}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada mata pelajaran pada unit ini.</div>'}</div>`;
 }
 c.innerHTML=`<div class="card"><div class="sectionhead"><h3>Pengaturan Data Master</h3><span class="pill">${masterSection==='kelas'?'Pengelolaan Kelas':'Pengelolaan Mata Pelajaran'}</span></div><p class="muted">Pengisian kelas dan mata pelajaran sekarang berada pada subtab terpisah. Pilih jenis lembaga dan jenjang yang akan dikelola.</p>${sectionTabs}${unitNav}</div>${main}`;
}
function saveMasterMajor(e){e.preventDefault();const nama=String(new FormData(e.target).get('nama')||'').trim();db.jurusanMA=Array.isArray(db.jurusanMA)?db.jurusanMA:[];if(!nama)return;if(db.jurusanMA.some(j=>String(j.nama||'').toLowerCase()===nama.toLowerCase())){alert('Jurusan tersebut sudah ada.');return}db.jurusanMA.push({id:id(),nama,mapel:[],kelas:[]});save();masterMATab='jurusan';masterDataPage()}
function deleteMasterMajor(mid){if(!confirm('⚠️ Hapus jurusan ini?\n\nKelas yang sudah terhubung tetap tersimpan, tetapi tidak lagi memiliki jurusan. Lanjutkan jika Anda yakin.'))return;db.jurusanMA=(db.jurusanMA||[]).filter(j=>j.id!==mid);db.kelas.forEach(k=>{if(k.jurusanId===mid)k.jurusanId=''});save();masterDataPage();showToast('Jurusan berhasil dihapus.')}
function saveClassColumns(e){e.preventDefault();const u=masterUnitParts(),fd=new FormData(e.target),tingkat=String(fd.get('tingkat')||'').trim(),rombel=fd.getAll('rombel').map(v=>String(v).trim()).filter(Boolean),jurusanId=String(fd.get('jurusanId')||'');if(!tingkat)return;const isMA=u.jenis==='Madrasah'&&u.jenjang==='MA',major=isMA?(db.jurusanMA||[]).find(j=>j.id===jurusanId):null;if(isMA&&!major){alert('Pilih jurusan MA yang valid terlebih dahulu.');return}if(!rombel.length){alert('Pilih minimal satu rombel.');return}let added=0;rombel.forEach(r=>{const nama=[tingkat,major?.nama,r].filter(Boolean).join(' ');if(!db.kelas.some(x=>x.jenis===u.jenis&&x.jenjang===u.jenjang&&String(x.nama).trim().toLowerCase()===nama.toLowerCase())){db.kelas.push({id:id(),jenjang:u.jenjang,jenis:u.jenis,nama,...(jurusanId?{jurusanId}:{})});added++}});if(jurusanId){major.kelas=[...new Set([...(major.kelas||[]),...db.kelas.filter(k=>k.jurusanId===jurusanId).map(k=>k.id)])]}save();masterDataPage();alert(`${added} kelas berhasil ditambahkan.`)}
function saveBulkMaster(e,kind){e.preventDefault();const u=masterUnitParts(),fd=new FormData(e.target),names=[...new Set(String(fd.get('items')||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))],jurusanId=String(fd.get('jurusanId')||'');if(!names.length)return;if(kind==='kelas'){if(u.jenis==='Madrasah'&&u.jenjang==='MA'&&!db.jurusanMA?.some(j=>j.id===jurusanId)){alert('Pilih jurusan MA terlebih dahulu.');return}names.forEach(n=>{if(!db.kelas.some(x=>x.jenis===u.jenis&&x.jenjang===u.jenjang&&String(x.nama).toLowerCase()===n.toLowerCase()))db.kelas.push({id:id(),jenjang:u.jenjang,jenis:u.jenis,nama:n,...(jurusanId?{jurusanId}:{})})});if(jurusanId){const j=db.jurusanMA.find(x=>x.id===jurusanId);j.kelas=[...new Set([...(j.kelas||[]),...db.kelas.filter(k=>k.jurusanId===jurusanId).map(k=>k.id)])]}}else{let a=u.jenis==='Pondok'?db.mapelPondok:db.mapelMadrasah;if(u.jenis==='Madrasah'&&u.jenjang==='MA'&&!db.jurusanMA?.some(j=>j.id===jurusanId)){alert('Pilih jurusan MA untuk mata pelajaran ini.');return}names.forEach(n=>{if(!a.some(x=>(!x.jenjang||x.jenjang===u.jenjang)&&String(x.nama).toLowerCase()===n.toLowerCase()&&(u.jenjang!=='MA'||(x.jurusanId||x.majorId)===jurusanId)))a.push({id:id(),nama:n,kode:'',jenjang:u.jenjang,...(u.jenjang==='MA'?{jurusanId}:{})})})}save();masterDataPage()}
function deleteMasterItem(kind,itemId){
 const u=masterUnitParts();
 if(kind==='kelas'){
  const x=db.kelas.find(z=>String(z.id)===String(itemId));if(!x){alert('Kelas tidak ditemukan.');return}
  if(!confirm('⚠️ Hapus kelas '+(x.nama||'ini')+'?\n\nPastikan kelas ini memang tidak lagi digunakan sebelum melanjutkan.'))return;
  const f=x.jenis==='Madrasah'?'kelasMadrasah':'kelasPondok';db.siswa.forEach(st=>{if(st.jenjang===x.jenjang&&st[f]===x.nama)st[f]=''});
  db.kelas=db.kelas.filter(z=>String(z.id)!==String(itemId));
 }else if(kind==='mapel'){

async function downloadCardsPDF(filename='Kartu_Ujian_A4_Versi_2_37.pdf'){
 const result=document.getElementById('pdfResult');
 const btn=document.getElementById('createPdfBtn');
 if(!result)return;
 if(!window.html2canvas){alert('Mesin render gambar belum termuat. Periksa koneksi internet lalu muat ulang aplikasi.');return}
 const JsPDF=window.jspdf&&window.jspdf.jsPDF?window.jspdf.jsPDF:window.jsPDF;
 if(!JsPDF){alert('Library jsPDF belum termuat. Muat ulang halaman dan pastikan koneksi internet aktif.');return}
 if(!db.siswa.length){result.innerHTML='<div class="notice">Belum ada data siswa untuk dibuat menjadi kartu ujian.</div>';return}
 if(btn){btn.disabled=true;btn.textContent='Sedang membuat PDF…'}
 result.innerHTML='<div class="notice">Sedang menyusun kartu dan membuat dokumen PDF. Mohon tunggu…</div>';
 let pdfRoot=null;
 try{
   // Buat sumber kartu di area kerja tersembunyi; tidak ada preview kartu di layar.
   makePrint('kartu');
   const designPreview=document.getElementById('printPreview');
   // Pastikan semua kartu tampil saat proses ekspor.
   designPreview?.classList.remove('card-template-mode');
   await new Promise(resolve=>setTimeout(resolve,450));
   const area=document.querySelector('#printPreview .print-area');
   if(!area)throw new Error('Data kartu tidak berhasil disiapkan. Periksa data siswa dan filter kelas.');
   await Promise.all([...area.querySelectorAll('img')].map(im=>{
     if(im.complete&&im.naturalWidth>0)return Promise.resolve();
     return new Promise(resolve=>{const done=()=>resolve();im.addEventListener('load',done,{once:true});im.addEventListener('error',done,{once:true});setTimeout(done,5000);});
   }));
   if(document.fonts&&document.fonts.ready)await document.fonts.ready;
   const pages=[...area.querySelectorAll('.paper-grid')];
   const ticketCount=area.querySelectorAll('.exam-ticket').length;
   if(ticketCount===0||!pages.length)throw new Error('Tidak ada siswa yang cocok dengan filter untuk diekspor.');
   // Jumlah 1–3 kartu tetap valid; setiap kartu dicetak pada halaman A4 yang sama.
   // Buat wadah ekspor tersendiri agar ukuran setiap lembar A4 konsisten.
   const livePreview=document.getElementById('printPreview');
   if(!livePreview)throw new Error('Area pratinjau kartu tidak ditemukan.');
   const oldPreviewId=livePreview.id;
   livePreview.id='printPreviewLive';
   pdfRoot=document.createElement('div');
   pdfRoot.id='printPreview';
   pdfRoot.style.cssText='position:fixed!important;left:0!important;top:0!important;width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;padding:0!important;background:#fff!important;opacity:1!important;pointer-events:none!important;z-index:999999!important;overflow:hidden!important;box-sizing:border-box!important;';
   document.body.appendChild(pdfRoot);
   const exportArea=document.createElement('div');
   exportArea.className='print-area';
   exportArea.style.cssText='width:210mm!important;margin:0!important;padding:0!important;background:#fff!important;';
   pdfRoot.appendChild(exportArea);
   const pdf=new JsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
   for(let i=0;i<pages.length;i++){
     const clone=pages[i].cloneNode(true);
     // Bersihkan halaman sebelumnya agar setiap tangkapan tepat satu lembar A4.
     exportArea.innerHTML='';
     // Gunakan aturan tata letak kartu yang sama dengan pratinjau.
     exportArea.appendChild(clone);
     const sourceCanvases=pages[i].querySelectorAll('.qr-code canvas');
     const clonedCanvases=clone.querySelectorAll('.qr-code canvas');
     sourceCanvases.forEach((source,index)=>{
       const target=clonedCanvases[index];
       if(!target)return;
       try{
         const img=document.createElement('img');
         img.src=source.toDataURL('image/png');
         img.alt='QR Code';
         const qrBox=source.closest('.qr-code');
         if(qrBox){const rect=qrBox.getBoundingClientRect();img.style.width=rect.width+'px';img.style.height=rect.height+'px';}
         img.style.display='block';
         img.style.objectFit='contain';
         target.replaceWith(img);
       }catch(e){console.warn('Canvas QR tidak dapat disalin:',e)}
     });
     await Promise.all([...clone.querySelectorAll('img')].map(im=>{
       if(im.complete&&im.naturalWidth>0)return Promise.resolve();
       return new Promise(resolve=>{const done=()=>resolve();im.addEventListener('load',done,{once:true});im.addEventListener('error',done,{once:true});setTimeout(done,5000);});
     }));
     await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
     // Render langsung dengan html2canvas global. Ini menghindari jalur
     // Worker html2pdf yang sebelumnya kadang mengembalikan canvas kosong di Android.
     const canvas=await window.html2canvas(pdfRoot,{
       scale:2.5,
       useCORS:true,
       allowTaint:false,
       backgroundColor:'#ffffff',
       logging:false,
       scrollX:0,
       scrollY:0,
       windowWidth:Math.ceil(210*96/25.4),
       windowHeight:Math.ceil(297*96/25.4),
       imageTimeout:20000,
       removeContainer:true
     });
     if(!canvas||!canvas.width||!canvas.height)throw new Error('Gambar halaman '+(i+1)+' kosong. Pastikan logo/gambar dapat dimuat, lalu coba lagi.');
     if(i>0)pdf.addPage('a4','portrait');
     pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,210,297,undefined,'FAST');
     canvas.width=1;canvas.height=1;
     clone.remove();
   }
   livePreview.id=oldPreviewId;
   const blob=pdf.output('blob');
   if(currentPdfUrl)URL.revokeObjectURL(currentPdfUrl);
   currentPdfUrl=URL.createObjectURL(blob);
   const safeName=filename.replace(/[\\/:*?"<>|]/g,'_');
   result.innerHTML=`<div class="notice"><b>PDF berhasil dibuat.</b> ${ticketCount} kartu • ${pages.length} halaman A4. Unduhan PDF sedang dimulai.</div>`;
   saveGeneratedPDF(safeName);
   result.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(err){console.error('Gagal membuat PDF kartu:',err);result.innerHTML=`<div class="notice">PDF belum berhasil dibuat. ${esc(err&&err.message?err.message:'Silakan coba kembali.')}</div>`;}
 finally{
   if(pdfRoot){
     const live=document.getElementById('printPreviewLive');
     if(live){live.id='printPreview';live.classList.remove('card-template-mode');}
     pdfRoot.remove();
   }
   if(btn){btn.disabled=false;btn.textContent='Ekspor PDF'}
 }
}
async function renderPdfInPage(blob){
 const host=document.getElementById('pdfCanvasPreview');
 if(!host)return;
 if(!window.pdfjsLib){host.innerHTML='<div class="notice">Mesin pratinjau PDF belum termuat. Periksa koneksi internet, lalu buat PDF kembali.</div>';return;}
 try{
   pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   const bytes=await blob.arrayBuffer();
   const doc=await pdfjsLib.getDocument({data:new Uint8Array(bytes)}).promise;
   host.innerHTML='';
   for(let n=1;n<=doc.numPages;n++){
     const page=await doc.getPage(n);
     const wrap=document.createElement('section');wrap.className='pdf-page-wrap';
     const label=document.createElement('div');label.className='pdf-page-label';label.textContent='Halaman '+n+' dari '+doc.numPages;
     const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d',{alpha:false});
     const base=page.getViewport({scale:1});
     const width=Math.max(280,Math.min(host.clientWidth-18,1100));
     const scale=(width/base.width)*Math.min(window.devicePixelRatio||1,2);
     const viewport=page.getViewport({scale});
     canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
     canvas.style.width='100%';canvas.style.height='auto';
     wrap.append(label,canvas);host.appendChild(wrap);
     await page.render({canvasContext:ctx,viewport}).promise;
   }
 }catch(err){console.error('Pratinjau PDF gagal:',err);host.innerHTML='<div class="notice">PDF berhasil dibuat, tetapi pratinjau belum dapat ditampilkan. Tekan tombol Simpan PDF untuk menyimpan file. '+esc(err&&err.message?err.message:'')+'</div>';}
}

// Satu mata pelajaran memiliki satu guru pengampu utama. Relasi memakai ID guru.
function getSubjectListForMaster(){
 const u=masterUnitParts();
 const a=u.jenis==='Pondok'?(db.mapelPondok||[]):(db.mapelMadrasah||[]);
 return a.filter(x=>!x.jenjang||x.jenjang===u.jenjang).sort((a,b)=>String(a.nama||'').localeCompare(String(b.nama||''),'id'));
}
function saveSubjectTeacher(mapelId,teacherId){
 if(currentUser?.readOnly){alert('Akun Kepala Madrasah hanya dapat melihat data.');return;}
 const u=masterUnitParts(),a=u.jenis==='Pondok'?db.mapelPondok:db.mapelMadrasah;
 const subject=(a||[]).find(x=>String(x.id)===String(mapelId));
 if(!subject){showToast('Mata pelajaran tidak ditemukan.','error');return;}
 const teacher=(db.guru||[]).find(g=>String(g.id)===String(teacherId));
 subject.guruId=teacher?String(teacher.id):'';
 subject.guruNama=teacher?String(teacher.nama||''):'';
 save();
 showToast(teacher?'Guru pengampu berhasil dihubungkan.':'Guru pengampu dihapus dari mata pelajaran.');
}
function enhanceSubjectTeacherMapping(){
 if(masterSection!=='mapel')return;
 const subjects=getSubjectListForMaster();
 const tables=[...document.querySelectorAll('#content table')];
 const table=tables.find(t=>[...t.querySelectorAll('th')].some(th=>/Nama Mata Pelajaran/i.test(th.textContent)));
 if(!table)return;
 const head=table.querySelector('thead tr');if(!head||head.querySelector('[data-guru-mapel-head]'))return;
 const th=document.createElement('th');th.textContent='Guru Pengampu';th.dataset.guruMapelHead='1';head.insertBefore(th,head.lastElementChild);
 const rows=[...table.querySelectorAll('tbody tr')];
 rows.forEach((tr,i)=>{
  const subject=subjects[i];if(!subject)return;
  const td=document.createElement('td'),select=document.createElement('select');
  select.style.minWidth='190px';
  const current=(db.guru||[]).find(g=>String(g.id)===String(subject.guruId||''));
  select.innerHTML='<option value="">— Pilih guru pengampu —</option>'+(db.guru||[]).map(g=>'<option value="'+esc(g.id)+'">'+esc(g.nama||'Guru tanpa nama')+(g.kodeGuru?' • '+esc(g.kodeGuru):'')+'</option>').join('');
  select.value=current?String(current.id):'';
  select.addEventListener('change',()=>saveSubjectTeacher(subject.id,select.value));
  td.appendChild(select);tr.insertBefore(td,tr.lastElementChild);
 });
}
const masterDataPageBeforeTeacherRelation=masterDataPage;
masterDataPage=function(){masterDataPageBeforeTeacherRelation();enhanceSubjectTeacherMapping();};

function subjectRecordFor(kind,mapel,level,klass){
 const arr=kind==='pondok'?(db.mapelPondok||[]):(db.mapelMadrasah||[]);
 return arr.find(x=>String(x.nama||'').trim()===String(mapel||'').trim()&&(!x.jenjang||!level||x.jenjang===level)&&(!klass||kind==='pondok'||!klass.jurusanId||!x.jurusanId||String(x.jurusanId||x.majorId)===String(klass.jurusanId)))||null;
}
function subjectTeacherFor(kind,mapel,level,klass){
 const subject=subjectRecordFor(kind,mapel,level,klass);if(!subject)return null;
 return (db.guru||[]).find(g=>String(g.id)===String(subject.guruId||''))||null;
}
function absentClassRows(kind){
 const jenis=kind==='pondok'?'Pondok':'Madrasah';
 return (db.kelas||[]).filter(k=>String(k.jenis||k.tipe||k.unit||'').toLowerCase().includes(jenis.toLowerCase())).sort((a,b)=>String(a.jenjang||'').localeCompare(String(b.jenjang||''))||String(a.nama||'').localeCompare(String(b.nama||''),'id',{numeric:true}));
}
function absentClassById(cid){return (db.kelas||[]).find(k=>String(k.id)===String(cid))||null;}
function absentScheduleRows(kind,date,klass){
 if(!date||!klass)return [];
 const arr=kind==='pondok'?(db.jadwalPondok||[]):(db.jadwalMadrasah||[]);
 return arr.filter(x=>String(x.tanggal||'')===String(date)&& (kind==='pondok'||!x.jenjang||String(x.jenjang)===String(klass.jenjang||'MTs')) && attendanceClassNames(x,kind,klass.jenjang||'MTs').includes(String(klass.nama||'')));
}
function absentStudentsForClass(klass,kind){
 if(!klass)return [];
 const field=kind==='pondok'?'kelasPondok':'kelasMadrasah';
 return (db.siswa||[]).filter(s=>String(s[field]||'').trim()===String(klass.nama||'').trim()&&(kind==='pondok'||!s.jenjang||String(s.jenjang)===String(klass.jenjang||'MTs'))).sort((a,b)=>String(a.nama||'').localeCompare(String(b.nama||''),'id'));
}

  const timeCfg=db.jamPelajaran?.[type]?.[slot]||{};

function teacherHasConflict(teacherId,target){

 };

function gridTeacherHasConflict(guru,type,date,slot,key){
 return Object.entries(currentPengawasGrid()).some(([otherKey,value])=>{
  if(otherKey===key||!sameTeacherValue(value,guru))return false;
  const p=otherKey.split('|');

 });

function scheduleSubjectJenjangMatch(item,picks){
 const raw=String(item?.jenjang??item?.tingkat??'').trim().toLowerCase();
 if(!raw||raw==='semua'||raw==='madrasah'||raw==='madrasah umum')return true;
 const key=raw.replace(/[^a-z]/g,'');
 const itemLevel=key.includes('aliyah')||key==='ma'||key.startsWith('ma')?'MA':(key.includes('mts')||key.includes('tsanawiyah')?'MTs':'');
 return !itemLevel||picks.includes(itemLevel);
}

 return source.filter(x=>scheduleSubjectJenjangMatch(x,picks));
}

function saveSchedule(e,t){
 e.preventDefault();
 const form=e.target;
 const a=t==='pondok'?db.jadwalPondok:db.jadwalMadrasah;
 const d=Object.fromEntries(new FormData(form));
 d.jenis=t==='pondok'?'Pondok':'Madrasah';
 let picks=[];
 if(t==='madrasah'){
  picks=[...form.querySelectorAll('input[name="jenjangPick"]:checked')].map(x=>x.value);
  if(!picks.length){alert('Centang minimal satu jenjang (MTs atau MA).');return;}
  d.jenjangs=picks.slice();
  d.jenjang=picks.includes('MA')?'MA':picks[0];
  d.jurusanIds=String(d.jurusanIds||'').split(',').filter(Boolean);
  d.kelasIds=String(d.kelasIds||'').split(',').filter(Boolean);
  if(picks.includes('MA')&&!d.jurusanIds.length){alert('Centang minimal satu jurusan MA.');return;}
  if(picks.includes('MA')&&!d.kelasIds.length){alert('Jurusan yang dipilih belum memiliki kelas. Tambahkan kelas pada menu Kelas & Mata Pelajaran terlebih dahulu.');return;}
  d.kelas=d.kelasIds.map(cid=>db.kelas.find(k=>k.id===cid)?.nama).filter(Boolean).join(', ');
 }else{
  d.jenjang=d.jenjang||'MTs';d.jenjangs=[d.jenjang];d.jurusanIds=[];
  const chosen=[...form.querySelectorAll('input[name="pondokClassPick"]:checked')].map(x=>x.value);
  if(!chosen.length){alert('Centang minimal satu kelas Pondok.');return;}
  d.kelasIds=chosen;d.kelas=chosen.map(cid=>db.kelas.find(k=>k.id===cid)?.nama).filter(Boolean).join(', ');d.kelasId=chosen[0];
 }
 if(!d.tanggal||!d.sesi||!d.mapel){alert('Lengkapi tanggal, sesi, dan mata pelajaran.');return;}
 const n=Number((String(d.sesi||'').match(/([1-3])/ )||[])[1]);
 const cfg=n&&db.jamPelajaran?.[t]?.['jam'+n];
 if(!cfg?.mulai||!cfg?.selesai||cfg.mulai>=cfg.selesai){alert('Atur terlebih dahulu Jam Mulai dan Jam Selesai pada subtab Pengaturan Jam untuk sesi yang dipilih.');return;}
 d.jamMulai=cfg.mulai;d.jamSelesai=cfg.selesai;
 const existing=editing?a.find(x=>x.id===editing):null;
 if(t==='pondok'){
  const start=timeMinutes(d.jamMulai),end=timeMinutes(d.jamSelesai);
  const overlaps=(x)=>{if(x.tanggal!==d.tanggal||x.id===editing)return false;const xs=timeMinutes(x.jamMulai),xe=timeMinutes(x.jamSelesai);if(start===null||end===null||xs===null||xe===null)return x.sesi===d.sesi;return start<xe&&xs<end;};
  const conflict=a.find(x=>overlaps(x)&&((Array.isArray(x.kelasIds)?x.kelasIds:String(x.kelasIds||x.kelasId||'').split(',').filter(Boolean)).some(cid=>d.kelasIds.includes(cid))));
  if(conflict){const names=(Array.isArray(conflict.kelasIds)?conflict.kelasIds:String(conflict.kelasIds||conflict.kelasId||'').split(',').filter(Boolean)).filter(cid=>d.kelasIds.includes(cid)).map(cid=>db.kelas.find(k=>k.id===cid)?.nama||cid);alert('Jadwal ditolak. Kelas '+names.join(', ')+' sudah memiliki ujian pada hari dan waktu yang bertumpang tindih.');return;}
 }

 const count=a.filter(x=>x.tanggal===d.tanggal&&x.id!==editing).length;
 if(!existing&&count>=3){alert('Maksimal 3 sesi ujian dalam satu hari.');return;}
 if(existing){Object.assign(existing,d);}
 else if(t==='madrasah'&&picks.length>1){
  picks.forEach(jen=>a.push({id:id(),...d,jenjang:jen,jenjangs:[jen],kelasIds:jen==='MA'?d.kelasIds:[],jurusanIds:jen==='MA'?d.jurusanIds:[],kelas:jen==='MA'?d.kelas:'',pengawas1:'',pengawas2:''}));
 }else{a.push({id:id(),...d,pengawas1:'',pengawas2:''});}
 editing=null;save();schedule(t);
}

function scheduleMatrixRows(type,levelFilter=''){

 const majors=(db.jurusanMA||[]).filter(j=>arr.some(x=>x.jenjang==='MA'&&(x.jurusan===j.nama||String(x.jurusanIds||'').split(',').includes(j.id)||(Array.isArray(x.jurusanIds)&&x.jurusanIds.includes(j.id)))));
 const hasMTs=type==='madrasah'&&arr.some(x=>x.jenjang==='MTs'||(Array.isArray(x.jenjangs)&&x.jenjangs.includes('MTs')));
 const groups=[...(hasMTs?[{id:'__MTS__',nama:'MTs',isMTs:true}]:[]),...majors];
 const getMajorIds=x=>Array.isArray(x.jurusanIds)?x.jurusanIds:String(x.jurusanIds||'').split(',').filter(Boolean);
 const belongs=(x,g)=>g.isMTs?(x.jenjang==='MTs'||(Array.isArray(x.jenjangs)&&x.jenjangs.includes('MTs'))):(x.jenjang==='MA'&&(x.jurusan===g.nama||getMajorIds(x).includes(g.id)));
 const keys=[...new Set(arr.map(x=>`${x.tanggal||''}|${x.sesi||''}`))].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
 const rows=keys.map(key=>{const [tanggal,sesi]=key.split('|'),items=arr.filter(x=>(x.tanggal||'')===tanggal&&(x.sesi||'')===sesi);const cells=[];groups.forEach(g=>{const records=items.filter(x=>belongs(x,g));const mapels=[...new Set(records.map(x=>{const tm=x.jamMulai&&x.jamSelesai?`${x.jamMulai}–${x.jamSelesai}`:'';return `${x.mapel||'-'}${tm?` (${tm})`:''}`}))];const kelas=[...new Set(records.flatMap(x=>{if(x.kelas)return String(x.kelas).split(/,\s*/);const ids=Array.isArray(x.kelasIds)?x.kelasIds:String(x.kelasIds||'').split(',').filter(Boolean);return ids.map(idv=>db.kelas.find(k=>k.id===idv)?.nama).filter(Boolean)}))];cells.push({mapel:mapels.join('\n')||'-',kelas:kelas.join(', ')||'-'});});return {tanggal,sesi,day:typeof dayLabel==='function'?dayLabel(tanggal):tanggal,cells,ids:items.map(x=>x.id).filter(Boolean),items};});
 return {groups,rows};
}

function attendanceClassNames(schedule,kind,level){
 const ids=Array.isArray(schedule.kelasIds)?schedule.kelasIds:String(schedule.kelasIds||schedule.kelasId||'').split(',').filter(Boolean);
 let names=ids.map(v=>db.kelas.find(k=>String(k.id)===String(v))?.nama).filter(Boolean);
 if(!names.length&&schedule.kelas) names=String(schedule.kelas).split(/,\s*/).filter(Boolean);
 if(!names.length){
  names=(db.kelas||[]).filter(k=>{
   const typ=String(k.jenis||k.tipe||k.unit||'').toLowerCase();
   const isPondok=typ.includes('pondok');
   const jen=String(k.jenjang||k.level||'').toLowerCase();
   return (kind==='pondok'?isPondok:!isPondok)&&(!level||!jen||jen===level.toLowerCase());
  }).map(k=>k.nama);
 }
 return [...new Set(names)];
}

<script>
/* ===== ABSEN SISWA: RENDER LANGSUNG TANPA WRAPPER REKURSIF ===== */
function attendanceRosterClasses(){
 const kind=attendanceMainTab==='pondok'?'pondok':'madrasah';
 const level=attendanceLevel==='MA'?'MA':'MTs';
 const field=kind==='pondok'?'kelasPondok':'kelasMadrasah';
 const students=Array.isArray(db.siswa)?db.siswa:[];
 const classes=Array.isArray(db.kelas)?db.kelas:[];
 let names=classes.filter(k=>k&&typeof k==='object').filter(k=>{
  const typ=String(k.jenis||k.tipe||k.unit||'').toLowerCase();
  const isPondok=typ.includes('pondok');
  return kind==='pondok'?isPondok:(!isPondok&&(!k.jenjang||String(k.jenjang)===level));
 }).map(k=>String(k.nama||'').trim()).filter(Boolean);
 if(!names.length) names=students.filter(x=>x&&typeof x==='object'&&(kind==='pondok'||!x.jenjang||String(x.jenjang)===level)).map(x=>String(x[field]||'').trim()).filter(Boolean);
 return [...new Set(names)].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
}
function attendanceSemesterArabic(value){
 const v=String(value||'GANJIL').toUpperCase();
 return (v.includes('GENAP')||v==='2'||v.includes('الثاني'))?'الثَّانِي':'الأَوَّل';
}
function attendanceRender(){
 try{
  if(!Array.isArray(db.siswa))db.siswa=[];

   c.innerHTML=`<div class="card">

   return;

  c.innerHTML=`<div class="card"><div class="tabs"><button type="button" onclick="attendanceMainTab='pondok';renderAttendance()">Absen Pondok</button><button type="button" class="active">Absen Madrasah</button></div><div class="tabs attendance-level-tabs"><button type="button" class="${attendanceLevel==='MTs'?'active':''}" onclick="attendanceLevel='MTs';renderAttendance()">MTs</button><button type="button" class="${attendanceLevel==='MA'?'active':''}" onclick="attendanceLevel='MA';renderAttendance()">MA</button></div><div class="tabs"><button type="button" class="active">Cetak Absen</button><button type="button" onclick="attendanceMadrasahView='pengaturan';renderAttendance()">Input Barcode & Link</button></div><div class="sectionhead"><h3>Absen Ujian Madrasah ${esc(attendanceLevel)}</h3><span class="muted">Pilih kelas, lalu buat daftar hadir.</span></div><div class="field"><label>Kelas</label><select id="attendanceClass"><option value="">Pilih kelas</option>${classes.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div><div class="toolbar"><button type="button" class="gold" onclick="generateAttendance()">Buat Absen & Cetak</button></div><div id="attendancePreview"></div></div>`;
 }catch(err){console.error('Gagal membuka Cetak Absen Siswa',err);const c=document.getElementById('content');if(c)c.innerHTML=`<div class="card"><div class="notice">Menu absen gagal dibuka. Data lama tidak dihapus. Detail: ${esc(err&&err.message?err.message:'Kesalahan tidak diketahui')}</div><button type="button" onclick="renderAttendance()">Coba Lagi</button></div>`;}

ht:1.6;font-size:11pt;direction:rtl}.abs-sign .sign-space{height:22mm}tr{page-break-inside:avoid}</style><header class="pondok-ar-kop"><div><p>لَجْنَةُ تَنْفِيذِ امْتِحَانِ الْفَصْلِ الدِّرَاسِيِّ ${semester}</p><h2>${esc(pondokName)}</h2>${pondokAddress?`<p>${esc(pondokAddress)}</p>`:''}</div>${logo}</header><section class="pondok-ar-info"><div class="info-row"><b>اليوم / التاريخ</b><span>: ........................................................................</span></div><div class="info-row"><b>المادة الدراسية</b><span>: ........................................................................</span></div><div class="info-row"><b>الصف</b><span>: ${esc(cls)}</span></div><div class="info-row"><b>المراقب</b><span>: ........................................................................</span></div></section><table class="pondok-ar-table"><thead><tr><th>الرقم</th><th>رقم امتحان الطالب</th><th>اسم الطالب</th><th>الحضور</th><th>ملاحظات</th></tr></thead><tbody>${rows}</tbody></table><div class="abs-bottom">${barcodeBlock}<div class="abs-sign">مراقب الامتحان<div class="sign-space"></div><b>(........................................)</b></div></div>`;
 }else{

op">${logo(school.logoKemenag||'','Logo Kementerian Agama')}<div class="abs-kop-text"><p class="ministry">KEMENTERIAN AGAMA REPUBLIK INDONESIA</p><h2>${esc(schoolIdentity('madrasah',level))}</h2>${school.address?`<p class="address">${esc(school.address)}</p>`:''}</div>${logo(rightLogo||'','Logo Madrasah')}</header><section class="abs-info"><div class="info-row"><b>Hari/Tanggal</b><span>: ........................................................................</span></div><div class="info-row"><b>Mata Pelajaran</b><span>: ........................................................................</span></div><div class="info-row"><b>Kelas</b><span>: ${esc(cls)}</span></div><div class="info-row"><b>Pengawas</b><span>: ........................................................................</span></div></section><table class="abs-table"><thead><tr><th>No.</th><th>Nomor Ujian Siswa</th><th>Nama Siswa</th><th>Kehadiran</th><th>Keterangan</th></tr></thead><tbody>${rows}</tbody></table><div class="abs-bottom">${barcodeBlock}<div class="abs-sign">Pengawas Ujian<div class="sign-space"></div><b>(........................................)</b></div></div>`;

}

/* Konfirmasi universal sebelum form penyimpanan diproses. */
document.addEventListener('submit',function(ev){
 const form=ev.target;
 if(!(form instanceof HTMLFormElement))return;
 const handler=String(form.getAttribute('onsubmit')||'');
 if(!/\b(save|assign|import|update|change|set)[A-Z_a-z0-9]*/i.test(handler))return;
 if(form.dataset.saveConfirmed==='yes'){delete form.dataset.saveConfirmed;return;}
 const submitter=ev.submitter;
 const label=String(submitter?.textContent||'').trim();
 const msg=/hapus|delete/i.test(label)?'⚠️ Hapus data ini?\n\nData yang dipilih akan dihapus dari aplikasi. Pastikan Anda memilih data yang benar sebelum melanjutkan.':'💾 Simpan data sekarang?\n\nPeriksa kembali informasi yang diisi. Jika sudah benar, pilih OK untuk menyimpan perubahan.';
 if(!window.confirm(msg)){ev.preventDefault();ev.stopImmediatePropagation();return;}
 form.dataset.saveConfirmed='yes';
},true);

</script>
<script>
/* ===== MENU REKAP ABSEN: KEHADIRAN PENGAWAS AKTUAL + SISWA TIDAK IKUT UJIAN ===== */
let rekapAbsenTab='pengawas';
let rekapPengawasFilter={tanggal:'',jenis:'pondok',slot:'jam1'};
function rekapGroupAssignments(){
 const f=rekapPengawasFilter;
 const rows=savedSupervisorAssignments().filter(x=>x&&x.date===f.tanggal&&x.type===f.jenis&&x.slot===f.slot);
 const groups=new Map();
 rows.forEach(x=>{
  const key=[x.date,x.type,x.slot,x.teacherId].join('|');
  if(!groups.has(key))groups.set(key,{date:x.date,type:x.type,slot:x.slot,time:x.time,teacherId:x.teacherId,teacher:x.teacher,classes:new Set(),subjects:new Set()});
  const g=groups.get(key);g.classes.add(x.kelas);if(x.mapel&&x.mapel!=='-')g.subjects.add(x.mapel);
 });
 return [...groups.values()].sort((a,b)=>a.teacher.localeCompare(b.teacher,'id'));
}
function renderRekapAbsen(){
 const c=document.getElementById('content');if(!c)return;
 if(rekapAbsenTab==='siswa'){
  attendanceSubtab='tidakHadir';absentEditId='';
  absentRender();
  return;
 }
 const all=savedSupervisorAssignments();
 const dates=[...new Set(all.map(x=>x.date))].sort();
 if(!rekapPengawasFilter.tanggal&&dates.length)rekapPengawasFilter.tanggal=dates[0];
 if(!dates.includes(rekapPengawasFilter.tanggal)&&dates.length)rekapPengawasFilter.tanggal=dates[0];
 const types=[...new Set(all.filter(x=>x.date===rekapPengawasFilter.tanggal).map(x=>x.type))];
 if(!types.includes(rekapPengawasFilter.jenis)&&types.length)rekapPengawasFilter.jenis=types[0];
 const slots=[...new Set(all.filter(x=>x.date===rekapPengawasFilter.tanggal&&x.type===rekapPengawasFilter.jenis).map(x=>x.slot))].sort();
 if(!slots.includes(rekapPengawasFilter.slot)&&slots.length)rekapPengawasFilter.slot=slots[0];
 const f=rekapPengawasFilter,groups=rekapGroupAssignments(),teachers=(db.guru||[]).filter(t=>t&&typeof t==='object').slice().sort((a,b)=>String(a.nama||a.namaGuru||a.name||'').localeCompare(String(b.nama||b.namaGuru||b.name||''),'id'));
 const formatRekapDate=d=>{const dt=new Date(String(d||'')+'T00:00:00');return Number.isNaN(dt.getTime())?String(d||'Tanggal tidak valid'):dt.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
 const records=Array.isArray(db.absensiPengawas)?db.absensiPengawas:[];
 const readonly=!!currentUser?.readOnly;
 const rows=groups.map((g,i)=>{
  const old=records.find(r=>r.tanggal===g.date&&r.jenis===g.type&&r.slot===g.slot&&String(r.pengawasId)===String(g.teacherId));
  const status=old?.status||'Hadir';
  return `<tr data-teacher="${esc(g.teacherId)}" data-old-id="${esc(old?.id||'')}"><td>${i+1}</td><td>${esc(g.teacher)}</td><td>${esc(g.time||g.slot)}</td><td>${esc([...g.subjects].join(', ')||'-')}</td><td>${esc([...g.classes].join(', '))}</td><td><select class="rekap-status" ${readonly?'disabled':''} onchange="this.closest('tr').querySelector('.rekap-replacement-wrap').style.display=this.value==='Tidak Hadir'?'':'none'"><option ${status==='Hadir'?'selected':''}>Hadir</option><option ${status==='Tidak Hadir'?'selected':''}>Tidak Hadir</option></select></td><td><div class="rekap-replacement-wrap" style="${status==='Tidak Hadir'?'':'display:none'}"><select class="rekap-replacement" ${readonly?'disabled':''}><option value="">Pilih guru pengganti</option>${teachers.filter(t=>String(t.id)!==String(g.teacherId)).map(t=>`<option value="${esc(t.id)}" ${String(old?.penggantiId||'')===String(t.id)?'selected':''}>${esc(t.nama||t.namaGuru||t.name||t.kodeGuru||'Guru tanpa nama')}${t.kodeGuru?' • '+esc(t.kodeGuru):''}</option>`).join('')}</select></div>${status==='Hadir'&&old?.penggantiNama?esc(old.penggantiNama):''}</td></tr>`;
 }).join('');
 const history=records.filter(r=>(!f.tanggal||r.tanggal===f.tanggal)&&r.jenis===f.jenis&&(!f.slot||r.slot===f.slot)).sort((a,b)=>String(a.namaPengawas||'').localeCompare(String(b.namaPengawas||''),'id'));
 c.innerHTML=`<div class="card"><div class="tabs"><button type="button" class="active">Absensi Pengawas</button><button type="button" onclick="rekapAbsenTab='siswa';renderRekapAbsen()">Absensi Siswa Tidak Ikut Ujian</button></div>
 <div class="sectionhead"><h3>Absensi Kehadiran Pengawas</h3><span class="muted">Catat kondisi kehadiran pada hari dan sesi ujian yang benar-benar berlangsung.</span></div><div class="toolbar"><button type="button" class="secondary" onclick="downloadRekapPDF('pengawas')">Unduh PDF Absensi Pengawas</button></div>
 <div class="formgrid"><div class="field"><label>Hari/Tanggal</label><select onchange="rekapPengawasFilter.tanggal=this.value;renderRekapAbsen()">${dates.map(d=>`<option value="${esc(d)}" ${f.tanggal===d?'selected':''}>${esc(formatRekapDate(d))}</option>`).join('')}</select></div><div class="field"><label>Jenis Ujian</label><select onchange="rekapPengawasFilter.jenis=this.value;rekapPengawasFilter.slot='';renderRekapAbsen()">${[['pondok','Pondok'],['madrasah','Madrasah']].filter(x=>types.includes(x[0])).map(x=>`<option value="${x[0]}" ${f.jenis===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Jam / Sesi</label><select onchange="rekapPengawasFilter.slot=this.value;renderRekapAbsen()">${slots.map(s=>{const x=all.find(a=>a.date===f.tanggal&&a.type===f.jenis&&a.slot===s);return `<option value="${esc(s)}" ${f.slot===s?'selected':''}>${esc(x?.time||s)}</option>`}).join('')}</select></div></div>
 ${!groups.length?'<div class="notice">Belum ada guru yang ditugaskan pada tanggal dan sesi ini. Periksa Jadwal Mengawas yang sudah disimpan.</div>':`<form onsubmit="saveRekapAbsensiPengawas(event)"><div class="tablewrap"><table><thead><tr><th>No.</th><th>Nama Pengawas</th><th>Jam</th><th>Mata Pelajaran</th><th>Kelas</th><th>Kehadiran</th><th>Guru Pengganti</th></tr></thead><tbody>${rows}</tbody></table></div><div class="toolbar"><button type="submit" ${readonly?'disabled':''}>Simpan Absensi Pengawas</button></div></form>`}
 </div><div class="card"><h3>Riwayat Absensi Sesi Ini</h3><div class="tablewrap"><table><thead><tr><th>Nama Pengawas</th><th>Status</th><th>Pengganti</th><th>Jam</th></tr></thead><tbody>${history.length?history.map(r=>`<tr><td>${esc(r.namaPengawas||'-')}</td><td>${esc(r.status||'-')}</td><td>${esc(r.penggantiNama||'-')}</td><td>${esc(r.jam||r.slot||'-')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada absensi yang disimpan untuk sesi ini.</td></tr>'}</tbody></table></div></div>`;
}
function saveRekapAbsensiPengawas(e){
 e.preventDefault();if(currentUser?.readOnly){alert('Akun Kepala Madrasah hanya dapat melihat data.');return;}
 const f=rekapPengawasFilter,groups=rekapGroupAssignments();if(!groups.length){alert('Tidak ada penugasan pengawas pada sesi ini.');return;}
 db.absensiPengawas=Array.isArray(db.absensiPengawas)?db.absensiPengawas:[];
 const trs=[...e.target.querySelectorAll('tbody tr[data-teacher]')];
 for(const tr of trs){const g=groups.find(x=>String(x.teacherId)===String(tr.dataset.teacher));if(!g)continue;
  const status=tr.querySelector('.rekap-status')?.value||'Hadir';const replacementId=tr.querySelector('.rekap-replacement')?.value||'';
  const replacement=(db.guru||[]).find(x=>String(x.id)===String(replacementId));
  if(status==='Tidak Hadir'&&!replacement){alert('Pilih guru pengganti untuk '+g.teacher+'.');return;}
  const item={id:tr.dataset.oldId||id(),tanggal:g.date,jenis:g.type,slot:g.slot,jam:g.time||g.slot,pengawasId:g.teacherId,namaPengawas:g.teacher,status,penggantiId:replacement?.id||'',penggantiNama:replacement?(replacement.nama||replacement.namaGuru||replacement.name||replacement.kodeGuru||'') :'',kelas:[...g.classes].join(', '),mataPelajaran:[...g.subjects].join(', '),updatedAt:new Date().toISOString()};
  const ix=db.absensiPengawas.findIndex(r=>String(r.id)===String(item.id));if(ix>=0)db.absensiPengawas[ix]={...db.absensiPengawas[ix],...item};else db.absensiPengawas.push(item);
 }
 save();showToast('Absensi pengawas berhasil disimpan.');renderRekapAbsen();
}
const adminPrintBeforeRekapAbsen=adminPrint;
adminPrint=function(kind){if(kind==='pengawas'){rekapAbsenTab='pengawas';renderRekapAbsen();return;}adminPrintBeforeRekapAbsen(kind);};

const absentRenderBeforeRekapTabs=absentRender;
absentRender=function(){
 absentRenderBeforeRekapTabs();
 if(rekapAbsenTab!=='siswa')return;
 const c=document.getElementById('content'),card=c?.querySelector('.card');if(!card)return;
 const innerTabs=card.querySelector('.tabs');if(innerTabs)innerTabs.remove();
 const tabs=document.createElement('div');tabs.className='tabs';
 tabs.innerHTML='<button type="button" onclick="rekapAbsenTab=\'pengawas\';renderRekapAbsen()">Absensi Pengawas</button><button type="button" class="active">Absensi Siswa Tidak Ikut Ujian</button>';
 card.insertBefore(tabs,card.firstChild);
};

};

أسئلة: ............... كراسة. عدد محاضر الامتحان: ............... نسخة.</p><p>ملاحظات أثناء سير الامتحان:</p><p class="dots">........................................................................................................<br>........................................................................................................<br>........................................................................................................<br>........................................................................................................</p><p>حُرّر هذا المحضر بكل صدق.</p><div class="sign">محرّر المحضر<br>مراقب الامتحان<br><br><br>الاسم: ........................................<br>رقم الهوية: ........................................</div></div></div>`;
 }else{
  const kop=documentLetterhead('madrasah',examDocLevel,'BERITA ACARA PELAKSANAAN UJIAN');
  html=`<style>@page{size:A4 portrait;margin:14mm}.ba-madrasah{font-family:Arial,sans-serif;color:#111;font-size:13px;line-height:1.75}.ba-madrasah p{margin:10px 0}.ba-madrasah .dots{line-height:2.5}.ba-madrasah .sign{width:48%;margin:28px 0 0 auto;text-align:center;line-height:1.8}</style>${kop}<div class="ba-madrasah"><p>Pada hari ini ................. tanggal ................. bulan ................. tahun .................</p><p>Telah diselenggarakan Ujian ......................... pada pukul ................. s/d .................</p><p>Pada Sekolah: ........................................................................</p><p>Ruang: ........................................................................</p><p>Jumlah peserta seharusnya: ................. orang</p><p>Jumlah peserta yang tidak hadir: ................. orang</p><p>Jumlah peserta yang hadir: ................. orang</p><p>Telah dibuka sampul soal ujian untuk mata pelajaran: ............................................................</p><p>Dengan kode: ............................................................</p><p>Jumlah lembar jawaban: ............... eksemplar. Jumlah naskah soal: ............... eksemplar. Jumlah berita acara: ............... eksemplar.</p><p><b>Catatan selama ujian berlangsung:</b></p><p class="dots">........................................................................................................................................<br>........................................................................................................................................<br>........................................................................................................................................<br>........................................................................................................................................</p><p>Berita acara ini dibuat dengan sesungguhnya.</p><div class="sign">Yang membuat berita acara,<br>Pengawas Ujian<br><br><br>Nama: ........................................<br>NIP: ........................................</div></div>`;
 }
 const preview=document.getElementById('examDocPreview');if(!preview)return;
 preview.innerHTML=`<div class="notice">Format berita acara kosong siap dicetak. Seluruh titik-titik diisi langsung oleh pengawas.</div><div class="toolbar no-print"><button type="button" onclick="printElement('examDocPrintArea')">Cetak / Simpan PDF</button></div><div id="examDocPrintArea" class="print-area">${html}</div>`;
};
function downloadRekapPDF(kind){
 const content=document.getElementById('content');if(!content)return;
 let title='',tables=[];
 if(kind==='pengawas'){
  title='Absensi Pengawas';tables=[...content.querySelectorAll('.card table')];
 }else{
  title='Absensi Siswa Tidak Ikut Ujian';tables=[...content.querySelectorAll('.card table')].slice(-1);
 }
 if(!tables.length){alert('Tabel belum tersedia untuk diunduh.');return;}
 const wrapper=document.createElement('div');wrapper.style.cssText='background:#fff;color:#111;padding:18px;font-family:Arial,sans-serif;width:100%';
 wrapper.innerHTML=`<h2 style="text-align:center;margin:0 0 6px">${title}</h2><p style="text-align:center;margin:0 0 16px">${esc((db.school||{}).name||'Panitia Ujian')} • Tahun Pelajaran ${esc((db.school||{}).year||'')}</p>`;
 tables.forEach((t,i)=>{const heading=kind==='pengawas'?(i===0?'Daftar Kehadiran Pengawas':'Riwayat Absensi Sesi'):'Daftar Siswa Tidak Ikut Ujian';const h=document.createElement('h3');h.textContent=heading;h.style.margin='14px 0 6px';wrapper.appendChild(h);const clone=t.cloneNode(true);clone.style.cssText='width:100%;border-collapse:collapse;font-size:10px';clone.querySelectorAll('th,td').forEach(cell=>cell.style.cssText='border:1px solid #333;padding:6px;text-align:left');wrapper.appendChild(clone);});
 if(typeof html2pdf==='function'){
  html2pdf().set({margin:8,filename:(kind==='pengawas'?'Absensi_Pengawas':'Absensi_Siswa_Tidak_Ikut_Ujian')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(wrapper).save();
 }else{
  const w=window.open('','_blank');if(!w){alert('Izinkan pop-up untuk mencetak PDF.');return;}w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;padding:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:6px;font-size:11px}</style></head><body>${wrapper.innerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
 }
}
